[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor"
version = "1.1.0"
description = "An LLM-powered agent that clones a repository, explores it with tools, and reports concrete issues."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "NewDadada" }]
keywords = ["llm", "agent", "code-review", "repository", "deepseek"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# langfuse 5.x requires Python >= 3.11, so tracing stays optional.
tracing = ["langfuse>=5.0"]
dev = [
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
repo-doctor-ui = "repo_doctor.web.server:main"

[project.urls]
Homepage = "https://github.com/NewDadada/RepoDoctor"
Repository = "https://github.com/NewDadada/RepoDoctor.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_doctor = ["prompts/*.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
