[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor"
version = "1.0.0"
description = "An LLM-powered agent that clones a repository, explores it with tools, and reports concrete issues."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NewDadada" }]
keywords = ["llm", "agent", "code-review", "repository", "deepseek"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "langfuse>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/NewDadada/RepoDoctor"
Repository = "https://github.com/NewDadada/RepoDoctor.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_doctor = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
